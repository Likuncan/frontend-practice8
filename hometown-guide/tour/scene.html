<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家乡三维地标 - 家乡文旅三维导览</title>
  <!-- 与首页同版本 Bootstrap 5.3.3，保持视觉统一 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    #sceneCanvas { display: block; width: 100%; height: 100%; }

    /* 顶部信息与返回按钮 */
    .scene-toolbar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      pointer-events: none; /* 容器不挡鼠标，按钮单独放开 */
    }
    .scene-toolbar > * { pointer-events: auto; }
    .scene-title {
      background: rgba(38, 70, 83, 0.85);
      color: #fff;
      border-radius: 0.5rem;
      padding: 0.35rem 0.9rem;
      font-size: 0.95rem;
    }

    /* 底部操作提示 */
    .scene-hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(38, 70, 83, 0.85);
      color: #fff;
      border-radius: 0.5rem;
      padding: 0.35rem 0.9rem;
      font-size: 0.85rem;
      white-space: nowrap;
      max-width: calc(100vw - 24px);
    }
    @media (max-width: 575.98px) {
      .scene-title { display: none; }
      .scene-hint { font-size: 0.75rem; white-space: normal; text-align: center; }
    }

    /* 加载中 / 失败提示覆盖层 */
    #sceneStatus {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf6f2;
      padding: 1rem;
    }
  </style>
</head>
<body>

  <div class="scene-toolbar">
    <a href="../index.html" class="btn btn-light btn-sm shadow-sm">&larr; 返回首页</a>
    <span class="scene-title">家乡三维地标</span>
  </div>

  <canvas id="sceneCanvas"></canvas>

  <div class="scene-hint">鼠标左键拖动旋转 · 滚轮缩放 · 右键平移（手机上单指旋转、双指缩放）</div>

  <!-- 初始为“加载中”，模块加载失败则切换为断网/错误提示 -->
  <div id="sceneStatus">
    <div class="text-center">
      <div class="spinner-border text-warning mb-3" role="alert" aria-hidden="true"></div>
      <p class="text-muted mb-0">家乡三维场景加载中…</p>
    </div>
  </div>

  <!-- Three.js 0.160.0：ES Module + importmap，版本号固定，不用 latest -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- CDN 加载失败（断网）兜底：8 秒内场景未就绪则给出明确提示 -->
  <script>
    let threeReady = false;
    window.markThreeReady = function () { threeReady = true; };
    function showLoadError() {
      const box = document.getElementById('sceneStatus');
      box.innerHTML =
        '<div class="alert alert-danger mb-0" style="max-width:420px;" role="alert">' +
          '<strong>三维场景加载失败。</strong><br>' +
          'Three.js 资源未能加载，可能处于断网状态，请检查网络后刷新页面。<br>' +
          '<a class="btn btn-outline-danger btn-sm mt-3" href="../index.html">返回首页</a>' +
        '</div>';
    }
    setTimeout(function () {
      if (!threeReady) { showLoadError(); }
    }, 8000);
    window.addEventListener('error', function (event) {
      if (/module script failed|Failed to fetch|dynamically imported module/i.test(event.message || '')) {
        showLoadError();
      }
    });
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    window.markThreeReady();

    // 水面实例在景区 IIFE 中创建，渲染循环需访问，故提升到模块级
    let waterSurface = null;

    /* ---------- 基础三件套 ---------- */
    const canvas = document.getElementById('sceneCanvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfdeedd);      // 暖调天空
    scene.fog = new THREE.Fog(0xfdeedd, 75, 160);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(30, 24, 34);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    /* ---------- 灯光：环境光 + 半球光 + 带阴影的方向光（暖阳） ---------- */
    scene.add(new THREE.AmbientLight(0xfff4e0, 0.4));
    scene.add(new THREE.HemisphereLight(0xffe8c9, 0x7a9b5c, 0.5));

    const sun = new THREE.DirectionalLight(0xfff1d6, 1.7);
    sun.position.set(26, 34, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -50;
    sun.shadow.camera.right = 50;
    sun.shadow.camera.top = 50;
    sun.shadow.camera.bottom = -50;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 110;
    scene.add(sun);

    /* ---------- 地面（暖色大地） ---------- */
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(110, 110),
      new THREE.MeshStandardMaterial({ color: 0xc9b48c })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    /* ---------- 道路：浅色十字路 + 通往古城墙的路 ---------- */
    function addRoad(width, length, x, z, rotation) {
      const road = new THREE.Mesh(
        new THREE.PlaneGeometry(width, length),
        new THREE.MeshStandardMaterial({ color: 0xb0a38c })
      );
      road.rotation.x = -Math.PI / 2;
      road.rotation.z = rotation || 0;
      road.position.set(x, 0.02, z);
      road.receiveShadow = true;
      scene.add(road);
    }
    addRoad(4, 110, 0, 0, 0);
    addRoad(110, 4, 0, 0, 0);
    addRoad(4, 20, -22, 12, 0);

    /* ---------- 文字标签（Canvas 纹理 Sprite，无需外部资源） ---------- */
    function makeLabel(text) {
      const cvs = document.createElement('canvas');
      const ctx = cvs.getContext('2d');
      const fontSize = 44;
      ctx.font = 'bold ' + fontSize + 'px sans-serif';
      cvs.width = Math.ceil(ctx.measureText(text).width) + 28;
      cvs.height = fontSize + 20;

      ctx.font = 'bold ' + fontSize + 'px sans-serif';
      ctx.fillStyle = 'rgba(255,251,245,0.92)';
      ctx.fillRect(0, 0, cvs.width, cvs.height);
      ctx.strokeStyle = 'rgba(120,53,15,0.4)';
      ctx.strokeRect(1, 1, cvs.width - 2, cvs.height - 2);
      ctx.fillStyle = '#5d4037';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 14, cvs.height / 2);

      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(cvs),
        depthTest: false
      }));
      const scale = 0.012;
      sprite.scale.set(cvs.width * scale, cvs.height * scale, 1);
      return sprite;
    }

    function addLabel(text, x, y, z) {
      const label = makeLabel(text);
      label.position.set(x, y, z);
      scene.add(label);
    }

    /* ---------- 中式歇山顶（四棱锥） ---------- */
    function addRoof(group, width, depth, baseY, roofHeight, color) {
      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(Math.max(width, depth) * 0.78, roofHeight, 4),
        new THREE.MeshStandardMaterial({ color: color })
      );
      roof.rotation.y = Math.PI / 4;
      roof.scale.x = width / Math.max(width, depth);
      roof.position.y = baseY + roofHeight / 2;
      roof.castShadow = true;
      group.add(roof);
    }

    /* ---------- 通用中式殿堂：台基 + 屋身 + 屋顶 ---------- */
    function addHall(x, z, width, depth, wallHeight, wallColor, roofColor, name) {
      const group = new THREE.Group();

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(width, wallHeight, depth),
        new THREE.MeshStandardMaterial({ color: wallColor })
      );
      body.position.y = wallHeight / 2;
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      addRoof(group, width * 1.25, depth * 1.25, wallHeight, wallHeight * 0.65, roofColor);
      group.position.set(x, 0, z);
      scene.add(group);

      addLabel(name, x, wallHeight * 1.75 + 1.2, z);
      return group;
    }

    /* ==========================================================
       家乡地标布局（名称与 JS 数组、spots.json 完全一致）
       ========================================================== */

    /* ① 古城墙：长墙 + 垛口 + 城门楼（南侧） */
    (function buildCityWall() {
      const group = new THREE.Group();
      const wallColor = 0x9e7b58;
      const startX = -38, endX = -8, wallZ = 0, wallH = 5, wallT = 1.6;

      // 两段墙身，中间留城门洞
      [-19.5, -26.5].forEach(function (cx) {
        const seg = new THREE.Mesh(
          new THREE.BoxGeometry(13, wallH, wallT),
          new THREE.MeshStandardMaterial({ color: wallColor })
        );
        seg.position.set(cx, wallH / 2, wallZ);
        seg.castShadow = true;
        seg.receiveShadow = true;
        group.add(seg);
      });

      // 垛口（两侧各一排）
      for (let x = startX; x <= endX; x += 2.4) {
        [-wallT / 2 - 0.15, wallT / 2 + 0.15].forEach(function (dz) {
          const merlon = new THREE.Mesh(
            new THREE.BoxGeometry(0.9, 0.9, 0.6),
            new THREE.MeshStandardMaterial({ color: 0x8a6b4b })
          );
          merlon.position.set(x, wallH + 0.45, dz);
          merlon.castShadow = true;
          group.add(merlon);
        });
      }

      // 城门楼：城楼立于门洞上方
      const tower = new THREE.Group();
      const upper = new THREE.Mesh(
        new THREE.BoxGeometry(7, 3, 3.4),
        new THREE.MeshStandardMaterial({ color: 0xc1440e })
      );
      upper.position.y = wallH + 1.5;
      upper.castShadow = true;
      tower.add(upper);
      addRoof(tower, 8.4, 4.6, wallH + 3, 2.2, 0x4e342e);
      tower.position.set(-23, 0, 0);
      group.add(tower);

      group.position.set(0, 0, 22);
      scene.add(group);
      addLabel('古城墙', -23, 12.5, 22);
    })();

    /* ② 文庙：红墙黛瓦殿堂（西南区） */
    addHall(-8, -16, 8, 6, 4.5, 0xb03a2e, 0x37474f, '文庙');
    // 文庙前泮池（小水池）
    const panPool = new THREE.Mesh(
      new THREE.CircleGeometry(2.2, 32),
      new THREE.MeshStandardMaterial({ color: 0x4fa3d1 })
    );
    panPool.rotation.x = -Math.PI / 2;
    panPool.position.set(-8, 0.04, -9.5);
    scene.add(panPool);

    /* ③ 青云山：叠翠群峰（东北区） */
    (function buildMountain() {
      const group = new THREE.Group();
      const peaks = [
        { x: 0, z: 0, r: 9, h: 14 },
        { x: -7, z: 3, r: 6, h: 9 },
        { x: 6, z: 4, r: 5.5, h: 8 }
      ];
      peaks.forEach(function (p) {
        const peak = new THREE.Mesh(
          new THREE.ConeGeometry(p.r, p.h, 7),
          new THREE.MeshStandardMaterial({ color: 0x558b2f, flatShading: true })
        );
        peak.position.set(p.x, p.h / 2, p.z);
        peak.castShadow = true;
        peak.receiveShadow = true;
        group.add(peak);
        // 山顶浅色岩面
        const cap = new THREE.Mesh(
          new THREE.ConeGeometry(p.r * 0.35, p.h * 0.3, 7),
          new THREE.MeshStandardMaterial({ color: 0xa5d6a7, flatShading: true })
        );
        cap.position.set(p.x, p.h * 0.82, p.z);
        group.add(cap);
      });
      group.position.set(24, 0, -22);
      scene.add(group);
      addLabel('青云山', 24, 16, -22);
    })();

    /* ④ 烈士纪念馆：肃穆场馆 + 纪念碑（西北区） */
    addHall(-26, -14, 9, 5.5, 4, 0xe0e0e0, 0x616161, '烈士纪念馆');
    (function buildMonument() {
      const plinth = new THREE.Mesh(
        new THREE.BoxGeometry(3.4, 0.8, 3.4),
        new THREE.MeshStandardMaterial({ color: 0x9e9e9e })
      );
      plinth.position.set(-26, 0.4, -6.5);
      plinth.castShadow = true;
      plinth.receiveShadow = true;
      scene.add(plinth);

      const obelisk = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 8, 0.9),
        new THREE.MeshStandardMaterial({ color: 0xf5f5f5 })
      );
      obelisk.position.set(-26, 4.8, -6.5);
      obelisk.castShadow = true;
      scene.add(obelisk);

      const tip = new THREE.Mesh(
        new THREE.ConeGeometry(0.75, 1.6, 4),
        new THREE.MeshStandardMaterial({ color: 0xf5f5f5 })
      );
      tip.rotation.y = Math.PI / 4;
      tip.position.set(-26, 9.6, -6.5);
      scene.add(tip);
    })();

    /* ⑤ 老街：两旁连片传统铺面（东区中部） */
    (function buildOldStreet() {
      const stallColors = [0xd9822b, 0xc1440e, 0x8d6e63, 0xef6c00, 0xa1887f];
      const zs = [-12, -6, 0, 6, 12];
      zs.forEach(function (z, i) {
        [-1, 1].forEach(function (side) {
          const stall = new THREE.Mesh(
            new THREE.BoxGeometry(3.4, 2.4 + (i % 2) * 0.8, 3),
            new THREE.MeshStandardMaterial({ color: stallColors[i % stallColors.length] })
          );
          stall.position.set(side * 4.2, stall.geometry.parameters.height / 2, z);
          stall.castShadow = true;
          stall.receiveShadow = true;
          scene.add(stall);

          const roof = new THREE.Mesh(
            new THREE.ConeGeometry(2.6, 1.4, 4),
            new THREE.MeshStandardMaterial({ color: 0x4e342e })
          );
          roof.rotation.y = Math.PI / 4;
          roof.scale.x = 1.5;
          roof.position.set(side * 4.2, stall.geometry.parameters.height + 0.7, z);
          roof.castShadow = true;
          scene.add(roof);
        });
      });
      addLabel('老街', 0, 6.5, 0);
    })();

    /* ⑥ 滨湖湿地公园：水面 + 芦苇 + 绿岛（东南区） */
    (function buildWetland() {
      const water = new THREE.Mesh(
        new THREE.CircleGeometry(11, 40),
        new THREE.MeshStandardMaterial({ color: 0x4fa3d1, transparent: true, opacity: 0.9 })
      );
      water.rotation.x = -Math.PI / 2;
      water.position.set(22, 0.05, 16);
      water.receiveShadow = true;
      waterSurface = water;
      scene.add(water);

      // 绿岛
      const isle = new THREE.Mesh(
        new THREE.CircleGeometry(2.6, 24),
        new THREE.MeshStandardMaterial({ color: 0x7cb342 })
      );
      isle.rotation.x = -Math.PI / 2;
      isle.position.set(22, 0.07, 16);
      scene.add(isle);

      // 芦苇（细圆柱环水分布）
      for (let i = 0; i < 26; i++) {
        const angle = (i / 26) * Math.PI * 2;
        const r = 8.6 + (i % 3);
        const reed = new THREE.Mesh(
          new THREE.CylinderGeometry(0.06, 0.08, 1.4, 5),
          new THREE.MeshStandardMaterial({ color: 0x8d6e63 })
        );
        reed.position.set(22 + Math.cos(angle) * r, 0.7, 16 + Math.sin(angle) * r);
        scene.add(reed);
      }
      addLabel('滨湖湿地公园', 22, 4, 28.5);
    })();

    /* ⑦ 古戏台：临水戏台（中部） */
    (function buildStage() {
      const group = new THREE.Group();
      const platform = new THREE.Mesh(
        new THREE.BoxGeometry(5, 1, 3.6),
        new THREE.MeshStandardMaterial({ color: 0xa1887f })
      );
      platform.position.y = 0.5;
      platform.castShadow = true;
      platform.receiveShadow = true;
      group.add(platform);

      // 四根台柱
      [[-2, -1.4], [-2, 1.4], [2, -1.4], [2, 1.4]].forEach(function (p) {
        const pillar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.14, 0.14, 4, 10),
          new THREE.MeshStandardMaterial({ color: 0x6d4c41 })
        );
        pillar.position.set(p[0], 3, p[1]);
        group.add(pillar);
      });

      addRoof(group, 6.4, 4.8, 5, 2, 0x4e342e);
      group.position.set(-2, 0, 8);
      scene.add(group);
      addLabel('古戏台', -2, 8.5, 8);
    })();

    /* ⑧ 民俗小吃街：街边摊位（东区南端，作为老街延伸） */
    (function buildFoodStreet() {
      [0, 1, 2, 3].forEach(function (i) {
        const cart = new THREE.Mesh(
          new THREE.BoxGeometry(2, 1.6, 1.8),
          new THREE.MeshStandardMaterial({ color: i % 2 ? 0xef6c00 : 0xd9822b })
        );
        cart.position.set(10 + i * 2.6, 0.8, -20);
        cart.castShadow = true;
        scene.add(cart);

        const awning = new THREE.Mesh(
          new THREE.BoxGeometry(2.2, 0.2, 2),
          new THREE.MeshStandardMaterial({ color: 0xc62828 })
        );
        awning.position.set(10 + i * 2.6, 1.8, -20);
        scene.add(awning);
      });
      addLabel('民俗小吃街', 14, 3.5, -23);
    })();

    /* ---------- 树木：散布于路边与景点间隙 ---------- */
    function addTree(x, z, scale) {
      const s = scale || 1;
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25 * s, 0.35 * s, 1.6 * s, 10),
        new THREE.MeshStandardMaterial({ color: 0x795548 })
      );
      trunk.position.y = 0.8 * s;
      trunk.castShadow = true;
      tree.add(trunk);
      const crown = new THREE.Mesh(
        new THREE.SphereGeometry(1.3 * s, 16, 12),
        new THREE.MeshStandardMaterial({ color: 0x33691e })
      );
      crown.position.y = 2.4 * s;
      crown.castShadow = true;
      tree.add(crown);
      tree.position.set(x, 0, z);
      scene.add(tree);
    }
    [
      [-4, -6], [4, 6], [-14, -6], [-14, 6], [8, 16], [-30, 0],
      [8, -16], [30, 0], [-4, 16], [0, -26], [14, 6], [-16, -22],
      [14, -10], [-12, 4]
    ].forEach(function (p) { addTree(p[0], p[1]); });

    /* ---------- 入口牌坊（场景南缘，古城墙对面） ---------- */
    (function buildPaifang() {
      const mat = new THREE.MeshStandardMaterial({ color: 0x8d6e63 });
      [-4.5, 4.5].forEach(function (x) {
        const pillar = new THREE.Mesh(new THREE.BoxGeometry(1, 7, 1), mat);
        pillar.position.set(x, 3.5, 34);
        pillar.castShadow = true;
        scene.add(pillar);
      });
      const beam = new THREE.Mesh(new THREE.BoxGeometry(10.5, 1.2, 1.2), mat);
      beam.position.set(0, 7, 34);
      beam.castShadow = true;
      scene.add(beam);
      addLabel('家乡欢迎您', 0, 9.2, 34);
    })();

    /* ---------- 轨道控制器：可旋转 / 缩放 / 平移，不能钻到地下 ---------- */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-2, 2, 2);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 8;
    controls.maxDistance = 80;
    controls.maxPolarAngle = Math.PI / 2 - 0.03;
    controls.update();

    /* ---------- 响应式：窗口尺寸变化时同步相机与渲染器 ---------- */
    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ---------- 渲染循环 ---------- */
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      // 水面轻微明暗变化
      if (waterSurface) {
        waterSurface.material.opacity = 0.82 + Math.sin(t * 1.5) * 0.06;
      }
      controls.update();
      renderer.render(scene, camera);
    }

    // 场景就绪：隐藏加载遮罩并开始渲染
    document.getElementById('sceneStatus').style.display = 'none';
    animate();
  </script>
</body>
</html>
